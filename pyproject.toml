[project]
name = "podman-flake-triage"
version = "0.1.0"
description = "Evidence-first flake detection and triage for Podman's GitHub Actions CI"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
flake-triage = "flake_triage.__main__:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = [
    "BLE001",  # broad excepts are deliberate at pipeline stage boundaries (logged, never silent)
    "FLY002",  # str.join of static lists reads better than f-strings in tests
    "ISC004",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["flake_triage*"]
